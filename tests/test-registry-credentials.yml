name: Test Kubescape registry credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: nginx:latest
          format: json
          outputFile: /tmp/kubescape-registry-results
          registryUsername: "testuser"
          registryPassword: "testpassword"
        continue-on-error: true
      - name: Assert action ran with registry credential inputs
        run: |
          echo "Action completed (exit may be non-zero due to scan findings)"
          echo "PASS: registryUsername and registryPassword inputs were accepted"
