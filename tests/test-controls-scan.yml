name: Test controls scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with specific controls
        id: scan
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          controls: "C-0001,C-0002"
          format: junit
          outputFile: results-controls
          severityThreshold: critical

      - name: Assert results file was created
        run: |
          echo "Checking for results-controls.xml (junit format)"
          if [ ! -f results-controls.xml ]; then
            echo "FAIL: results-controls.xml not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results-controls.xml exists"
          cat results-controls.xml | head -20
