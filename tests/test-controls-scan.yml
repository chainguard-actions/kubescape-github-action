name: Test Kubescape controls scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with specific controls
        id: action
        uses: .
        with:
          controls: "C-0001, C-0002"
          files: pristine/kubescape--github-action/v3.0.1/tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results-controls
          severityThreshold: critical
        continue-on-error: true

      - name: Assert controls scan ran
        run: |
          echo "Checking that kubescape controls scan ran..."
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: controls scan ran with outcome: ${{ steps.action.outcome }}"
