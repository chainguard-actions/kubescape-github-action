name: Test controls scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Kubescape controls scan
        id: action
        uses: .
        with:
          files: pristine/kubescape--github-action/v3.0.5/tests/fixtures/k8s/deployment.yaml
          controls: "Privileged container"
          format: junit
          outputFile: results
          complianceThreshold: "0"
        continue-on-error: true
      - name: Assert controls scan ran
        run: |
          echo "Checking that kubescape controls scan ran..."
          echo "PASS: Controls scan step completed"
