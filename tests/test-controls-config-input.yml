name: Test Kubescape scan with controlsConfig input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with controlsConfig input
        id: scan
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          controls: "C-0016"
          format: json
          outputFile: results-controls-config
          failedThreshold: "100"
          severityThreshold: "critical"
          controlsConfig: tests/fixtures/controls-config.json

      - name: Assert scan produced JSON output file
        run: |
          echo "Scan step outcome: ${{ steps.scan.outcome }}"
          if [ ! -f results-controls-config.json ]; then
            echo "FAIL: results-controls-config.json not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results-controls-config.json exists"
          echo "--- File size ---"
          wc -c results-controls-config.json
          echo "--- First 10 lines ---"
          head -10 results-controls-config.json || true
