name: Test Kubescape image scan with registry credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape image scan with registry credentials
        id: action
        uses: .
        with:
          image: "nginx:alpine"
          format: junit
          outputFile: results-registry
          severityThreshold: critical
          registryUsername: "testuser"
          registryPassword: "testpassword"
        continue-on-error: true

      - name: Assert scan ran
        run: |
          echo "Checking that kubescape image scan with registry credentials ran..."
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: image scan with registry credentials ran with outcome: ${{ steps.action.outcome }}"
