name: Test error when both failedThreshold and complianceThreshold are specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run kubescape with both failedThreshold and complianceThreshold (should fail)
        id: action
        continue-on-error: true
        uses: .
        with:
          frameworks: NSA
          files: tests/fixtures/k8s/deployment.yaml
          failedThreshold: 50
          complianceThreshold: 80

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both failedThreshold and complianceThreshold are specified, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both threshold options were specified"
