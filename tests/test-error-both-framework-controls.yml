name: Test error when both frameworks and controls are specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          frameworks: NSA
          controls: "C-0016"
          files: "tests/fixtures/deployment.yaml"
          failedThreshold: "100"
          format: junit
          outputFile: results-error
        continue-on-error: true
      - name: Assert action failed when both frameworks and controls are specified
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both frameworks and controls are specified, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when both frameworks and controls were specified"
