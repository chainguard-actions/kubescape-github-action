name: Test Kubescape scan with account and exceptions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with account and exceptions
        id: action
        uses: .
        with:
          files: actions/hardened/kubescape--github-action/v3.0.1/tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results-account
          severityThreshold: critical
          account: "test-account-id"
          exceptions: actions/hardened/kubescape--github-action/v3.0.1/tests/fixtures/exceptions.json
        continue-on-error: true

      - name: Assert scan ran
        run: |
          echo "Checking that kubescape scan with account and exceptions ran..."
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: scan with account and exceptions ran with outcome: ${{ steps.action.outcome }}"
