name: Test basic scan (all frameworks)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan on fixture file
        id: scan
        # The action exits 1 if severity threshold is exceeded; use critical to
        # avoid failing on the test fixture. We also allow the step to fail so
        # we can assert on the output file being created.
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results
          severityThreshold: critical

      - name: Assert results file was created
        run: |
          echo "Checking for results.xml (junit format)"
          if [ ! -f results.xml ]; then
            echo "FAIL: results.xml not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results.xml exists"
          cat results.xml | head -20
