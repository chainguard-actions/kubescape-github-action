name: Test basic Kubescape scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape basic scan
        id: scan
        # Allow the action to fail (controls may fail) — we just want it to run
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results
          # Set a high threshold so the action doesn't fail the step
          failedThreshold: "100"
          severityThreshold: "critical"

      - name: Assert scan produced output file
        run: |
          echo "Checking for results.xml (junit format)"
          if [ ! -f results.xml ]; then
            echo "FAIL: results.xml not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results.xml exists"
          echo "--- File content (first 20 lines) ---"
          head -20 results.xml || true
