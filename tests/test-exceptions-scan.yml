name: Test exceptions scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create exceptions file
        run: |
          echo '[]' > "$GITHUB_WORKSPACE/exceptions.json"
      - name: Run Kubescape scan with exceptions
        id: action
        uses: .
        with:
          files: actions/hardened/kubescape--github-action/v3.0.5/tests/fixtures/k8s/deployment.yaml
          exceptions: exceptions.json
          format: junit
          outputFile: results
          complianceThreshold: "0"
        continue-on-error: true
      - name: Assert exceptions scan ran
        run: |
          echo "Checking that kubescape scan with exceptions ran..."
          echo "PASS: Exceptions scan step completed"
