name: Test compliance threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with compliance threshold
        id: action
        uses: .
        with:
          files: actions/hardened/kubescape--github-action/v3.0.21/tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results-compliance
          complianceThreshold: "0"
          failedThreshold: "100"
        continue-on-error: true

      - name: Assert compliance threshold scan completed
        run: |
          echo "Verifying compliance threshold scan completed..."
          echo "PASS: compliance threshold scan step completed"
