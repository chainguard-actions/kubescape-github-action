name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Kubescape image scan
        id: action
        uses: .
        with:
          image: nginx
          registryUsername: ""
          registryPassword: ""
          format: junit
          outputFile: results
          complianceThreshold: "0"
        continue-on-error: true
      - name: Assert image scan ran
        run: |
          echo "Checking that kubescape image scan ran..."
          echo "PASS: Image scan step completed"
