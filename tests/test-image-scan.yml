name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Kubescape image scan
        id: action
        uses: .
        with:
          image: nginx:stable-alpine
          format: json
          outputFile: results
        continue-on-error: true
      - name: Assert results file was created
        run: |
          echo "Checking for results file..."
          if [ ! -f results.json ]; then
            echo "FAIL: results.json not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results.json exists"
          echo "File size: $(wc -c < results.json) bytes"
