name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run Kubescape image scan
        id: scan
        uses: .
        with:
          image: nginx:stable
          registryUsername: ""
          registryPassword: ""
          format: json
          outputFile: results-image
          failedThreshold: "100"
          severityThreshold: critical
        continue-on-error: true

      - name: Assert image scan ran (results file created)
        run: |
          echo "Checking for image scan results file..."
          if ls results-image* 2>/dev/null; then
            echo "PASS: results-image file found: $(ls results-image*)"
          else
            echo "FAIL: No results-image file found"
            ls -la || true
            exit 1
          fi
