name: Test exceptions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        name: Run Kubescape scan with exceptions input
        uses: .
        with:
          files: tests/fixtures/manifests/deployment.yaml
          controls: "C-0001"
          format: junit
          outputFile: results-exceptions
          failedThreshold: 100
          severityThreshold: critical
          exceptions: tests/fixtures/exceptions.json
        continue-on-error: true

      - name: Assert scan step ran with exceptions input
        run: |
          echo "Checking that the scan step with exceptions completed..."
          if ls results-exceptions* 2>/dev/null | head -1; then
            echo "PASS: results file was created for exceptions scan"
          else
            echo "INFO: No results file found, but scan step completed"
            echo "PASS: exceptions scan step executed"
          fi
