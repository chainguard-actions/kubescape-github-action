name: Test Kubescape error when both frameworks and controls specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape with both frameworks and controls (should fail)
        id: action
        uses: .
        with:
          frameworks: NSA
          controls: "C-0001"
          files: pristine/kubescape--github-action/v3.0.1/tests/fixtures/k8s/deployment.yaml
          format: junit
          outputFile: results-error
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "Checking that action failed when both frameworks and controls were specified..."
          OUTCOME="${{ steps.action.outcome }}"
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both frameworks and controls were specified"
