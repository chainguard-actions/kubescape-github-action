name: Test Kubescape error - frameworks and controls both specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape with both frameworks and controls (should fail)
        id: scan
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          frameworks: NSA
          controls: "C-0001"
          format: junit
          outputFile: results-error

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both frameworks and controls are specified, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both frameworks and controls were specified"
