name: Test error when both failedThreshold and complianceThreshold specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Kubescape with both thresholds (should fail)
        id: action
        uses: .
        with:
          files: pristine/kubescape--github-action/v3.0.5/tests/fixtures/k8s/deployment.yaml
          frameworks: NSA
          failedThreshold: "50"
          complianceThreshold: "50"
          format: junit
          outputFile: results
        continue-on-error: true
      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when both failedThreshold and complianceThreshold are specified, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed when both thresholds were specified"
