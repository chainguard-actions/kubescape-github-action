name: Test framework scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run Kubescape scan with NSA framework
        id: scan
        uses: .
        with:
          files: tests/fixtures/manifests/deployment.yaml
          frameworks: NSA
          format: junit
          outputFile: results-nsa
          failedThreshold: "100"
          severityThreshold: critical
        continue-on-error: true

      - name: Assert scan ran with NSA framework
        run: |
          echo "Checking for NSA results file..."
          if ls results-nsa* 2>/dev/null; then
            echo "PASS: results-nsa file found: $(ls results-nsa*)"
          else
            echo "FAIL: No results-nsa file found"
            ls -la || true
            exit 1
          fi
