name: Test Kubescape framework scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape scan with NSA framework
        id: scan
        continue-on-error: true
        uses: .
        with:
          files: tests/fixtures/k8s/deployment.yaml
          frameworks: NSA
          format: json
          outputFile: results-nsa
          # High threshold so the step doesn't fail the job
          failedThreshold: "100"
          severityThreshold: "critical"

      - name: Assert scan produced JSON output file
        run: |
          echo "Checking for results-nsa.json (json format)"
          if [ ! -f results-nsa.json ]; then
            echo "FAIL: results-nsa.json not found"
            ls -la || true
            exit 1
          fi
          echo "PASS: results-nsa.json exists"
          echo "--- File size ---"
          wc -c results-nsa.json
          echo "--- First 10 lines ---"
          head -10 results-nsa.json || true
