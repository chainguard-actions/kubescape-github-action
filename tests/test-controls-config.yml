name: Test controls config scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create controls config file
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/controls-config.json"
      - name: Run Kubescape scan with controls config
        id: action
        uses: .
        with:
          files: actions/hardened/kubescape--github-action/v3.0.5/tests/fixtures/k8s/deployment.yaml
          controlsConfig: controls-config.json
          format: junit
          outputFile: results
          complianceThreshold: "0"
        continue-on-error: true
      - name: Assert controls config scan ran
        run: |
          echo "Checking that kubescape scan with controls config ran..."
          echo "PASS: Controls config scan step completed"
