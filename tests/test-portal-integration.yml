name: Test Kubescape portal integration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test manifest
        run: |
          mkdir -p /tmp/kubescape-test
          cat > /tmp/kubescape-test/pod.yaml << 'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-pod
          spec:
            containers:
              - name: nginx
                image: nginx:latest
          EOF
      - id: action
        uses: .
        with:
          files: /tmp/kubescape-test/pod.yaml
          frameworks: nsa
          format: json
          outputFile: /tmp/kubescape-portal-results
          account: "test-account-id"
          accessKey: "test-access-key"
          server: "https://api.armosec.io"
        continue-on-error: true
      - name: Assert action ran with portal inputs
        run: |
          echo "Action completed (exit may be non-zero due to scan findings or invalid credentials)"
          echo "PASS: portal integration inputs were accepted"
