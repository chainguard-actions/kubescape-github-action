name: Test Kubescape error when image and framework both specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape with both image and framework (should fail)
        id: action
        uses: .
        with:
          image: nginx
          frameworks: NSA
          format: junit
          outputFile: results-image-framework-error
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "Checking that action failed when both image and framework were specified..."
          OUTCOME="${{ steps.action.outcome }}"
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both image and framework were specified"
