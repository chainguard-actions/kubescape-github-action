name: Test Kubescape image scan with registry credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Kubescape image scan with registry credentials
        id: scan
        # Allow failure — credentials are fake but inputs must be exercised
        continue-on-error: true
        uses: .
        with:
          image: "nginx:latest"
          format: json
          outputFile: results-registry
          failedThreshold: "100"
          severityThreshold: "critical"
          registryUsername: "testuser"
          registryPassword: "testpassword"

      - name: Assert scan step ran
        run: |
          echo "Scan step outcome: ${{ steps.scan.outcome }}"
          # The action either scanned the image or failed due to credentials.
          # Either way, the inputs were exercised. We verify the step ran.
          if [ "${{ steps.scan.outcome }}" = "skipped" ]; then
            echo "FAIL: scan step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: scan step ran (outcome: ${{ steps.scan.outcome }})"
