name: Kubescape scanning for misconfigurations
on: [push, pull_request]
jobs:
  kubescape-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - uses: kubescape/github-action@7d90c1f159f02df1e3c79f839eeabe42ea30d4e3 # main
      continue-on-error: true
      with:
        format: sarif
        outputFile: results.sarif
        # Kubescape cloud account ID
        account: ${{secrets.KUBESCAPE_ACCOUNT}}
        # # Optional - Scan a specific path. Default will scan all
        # files: "examples/*.yaml"
    - name: Upload Kubescape scan results to Github Code Scanning
      uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2
      with:
        sarif_file: results.sarif
